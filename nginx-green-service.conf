server {
    listen 80;
    server_name green-service.online www.green-service.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name green-service.online www.green-service.online;

    ssl_certificate /etc/letsencrypt/live/green-service.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/green-service.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/green-service.online.access.log;
    error_log /var/log/nginx/green-service.online.error.log;

    location = /robots.txt {
        alias /home/lior0334/MAKE_MONEY/seo/robots.txt;
    }

    location = /sitemap.xml {
        alias /home/lior0334/MAKE_MONEY/seo/sitemap.xml;
        default_type application/xml;
    }

    location = /whatsapp-service {
        return 301 /whatsapp-service.html;
    }

    location = /whatsapp-service.html {
        alias /home/lior0334/MAKE_MONEY/seo/whatsapp-service.html;
        default_type text/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8899;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
